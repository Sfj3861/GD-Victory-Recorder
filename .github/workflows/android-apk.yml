name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-Victory-Recorder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: GD Victory Recorder v0.1.0
          body: |
            Primera versión de prueba de GD Victory Recorder.

            - Grabación de pantalla para Geometry Dash.
            - Marcador de victoria con parada automática tras 10 segundos.
            - Selectores de FPS y calidad.
            - Controles separados para micrófono y audio interno (según compatibilidad del dispositivo).
            - Interfaz renovada con estilo oscuro y acentos neón.

            Nota: versión de prueba. El funcionamiento de captura de audio y FPS altos depende del dispositivo.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
